[build]
rustc-wrapper = "sccache"
target-dir = "E:\\RenderDragon\\REPO\\.cargo\\target"

[profile.release]
codegen-units = 1
debug = false
# inherits = "release"
lto = true
opt-level = "s"
panic = "abort"
strip = true
trim-paths = false

[profile.smol]
inherits = "release"
opt-level = "z"
panic = "immediate-abort"
trim-paths = "all"

[source.aliyun]
registry = "sparse+https://mirrors.aliyun.com/crates.io-index/"

[source.crates-io]
replace-with = "aliyun"

[target.aarch64-linux-android]
linker = "D:\\CMDplus\\android-ndk-r26d\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\aarch64-linux-android26-clang.cmd"
rustflags = [
    "-C", "linker-flavor=gcc",
    "-C", "target-cpu=generic",
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--icf=all",
#    "-C", "link-arg=-Wl,-z,norelro",
#    "-C", "link-arg=-Wl,-z,max-page-size=16384",
#    "-C", "link-arg=-Wl,-z,common-page-size=16384",
]

[target.armv7-linux-androideabi]
linker = "D:\\CMDplus\\android-ndk-r26d\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\armv7a-linux-androideabi26-clang.cmd"
rustflags = ["-C", "linker-flavor=gcc"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "linker-flavor=gcc"]

[unstable]
# build-std = ["std", "panic_abort"]
panic-immediate-abort = true
trim-paths = true
